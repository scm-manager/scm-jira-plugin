# Use postgres/example user/password credentials
version: '3.9'


services:
  jira:
    image: atlassian/jira-software:latest
    container_name: jira
    environment:
      - ATL_JDBC_URL=jdbc:postgresql://db:5432/jira
      - ATL_JDBC_USER=jira
      - ATL_JDBC_PASSWORD=jira
    ports:
      - 8080:8080
    depends_on:
      - db
    networks:
      - jiranet
    volumes:
      - jira_jira_data:/var/atlassian/application-data/jira

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    ports:
      - 5432:5432
    volumes:
      - jira_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=jira
      - POSTGRES_USER=jira
      - POSTGRES_DB=jira
    networks:
      - jiranet

  adminer:
    image: adminer
    restart: always
    ports:
      - 8083:8080

networks:
  jiranet:
    driver: bridge

volumes:
  jira_postgres_data:
  jira_jira_data:
